<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' meetrec-media:; img-src 'self' data:; connect-src 'self' meetrec-media:">
  <title>MeetRec</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

    <aside class="sidebar">
      <div class="brand"><span class="logo" id="logo"></span>MeetRec<small id="ver"></small></div>
      <button class="rec-cta" id="recCta"></button>
      <nav class="nav" id="nav"></nav>
      <div class="side-status" id="sideStatus"></div>
    </aside>
    <section class="main">
      <header class="topbar" id="topbar"></header>
      <div class="view" id="view"></div>
    </section>
  </div>
  <div class="toasts" id="toasts"></div>
  <div id="modalRoot"></div>
  <audio id="audio" preload="metadata"></audio>
  <script src="../shared/icons.js"></script>
  <script type="module" src="app.js"></script>

</html>
