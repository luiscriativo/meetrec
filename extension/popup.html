<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg: #fff; --s2: #F3F3F8; --b: #E3E3EC; --t: #16161E; --m: #7A7A90; --a: #6D4AFF; --rec: #EE2F4A; --ok: #16A34A; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16161E; --s2: #1F1F29; --b: #2A2A36; --t: #EDEDF4; --m: #8A8AA0; --a: #8B6DFF; --ok: #34D399; } }
    body { margin: 0; width: 320px; font: 13px "Segoe UI", -apple-system, sans-serif; background: var(--bg); color: var(--t); }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--b); }
    header img { width: 26px; height: 26px; border-radius: 7px; }
    header b { font-size: 14px; }
    .pill { margin-left: auto; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; background: var(--s2); color: var(--m); }
    .pill.ok { background: rgba(22,163,74,.12); color: var(--ok); }
    .pill.rec { background: rgba(238,47,74,.12); color: var(--rec); }
    main { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .box { background: var(--s2); border-radius: 10px; padding: 10px 12px; line-height: 1.5; }
    .muted { color: var(--m); font-size: 12px; }
    label { font-weight: 600; font-size: 12px; display: block; margin-bottom: 5px; }
    input { width: 100%; box-sizing: border-box; height: 34px; border-radius: 8px; border: 1px solid var(--b); background: var(--bg); color: var(--t); padding: 0 10px; font: inherit; letter-spacing: .1em; text-transform: uppercase; }
    .row { display: flex; gap: 8px; }
    button { flex: 1; height: 34px; border-radius: 8px; border: 1px solid var(--b); background: var(--bg); color: var(--t); font: 600 12.5px inherit; font-family: inherit; cursor: pointer; }
    button:hover { background: var(--s2); }
    button.primary { background: var(--a); color: #fff; border-color: transparent; }
    button.rec { background: var(--rec); color: #fff; border-color: transparent; }
    .err { color: var(--rec); }
    .ok { color: var(--ok); }
  </style>
</head>
<body>
  <header><img src="icons/icon48.png" alt=""><b>MeetRec</b><span class="pill" id="pill">…</span></header>
  <main>
    <div class="box" id="conn">Verificando conexão…</div>
    <div class="box" id="tab"><span class="muted">Abra uma reunião no Teams ou Google Meet.</span></div>
    <div class="row" id="ctl" hidden>
      <button id="toggle" class="primary">● Gravar</button>
      <button id="marker">⚑ Marcar</button>
    </div>
    <div>
      <label for="token">Código de pareamento</label>
      <div class="row"><input id="token" maxlength="16" placeholder="Veja no app: Configurações → Integrações"><button id="save" style="flex:0 0 80px">Salvar</button></div>
    </div>
    <details><summary class="muted">Avançado</summary>
      <div style="margin-top:8px"><label for="port">Porta local</label><input id="port" style="text-transform:none;letter-spacing:0"></div>
    </details>
    <div class="muted">Dica: ative as <b>legendas ao vivo</b> na reunião para identificar os nomes com mais precisão.</div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
